<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8B5CF6">
    <title>MotoBind - Нет соединения</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0A0A0F;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #F8FAFC;
            padding: 20px;
        }
        .offline-container {
            text-align: center;
            max-width: 400px;
        }
        .offline-icon {
            font-size: 72px;
            margin-bottom: 24px;
            opacity: 0.6;
        }
        .offline-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .offline-text {
            color: #64748B;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .retry-btn {
            padding: 12px 32px;
            background: #8B5CF6;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .retry-btn:hover {
            background: #7C3AED;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1 class="offline-title">Нет соединения</h1>
        <p class="offline-text">
            Проверьте подключение к интернету<br>
            и попробуйте снова
        </p>
        <button class="retry-btn" onclick="location.reload()">
            Обновить
        </button>
    </div>
</body>
</html>
