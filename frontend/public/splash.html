<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#8B5CF6">
    <title>MotoBind</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0A0A0F;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        
        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            animation: fadeIn 0.6s ease-out;
            padding: 20px;
        }
        
        .splash-icon {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            background: linear-gradient(135deg, #8B5CF6, #7C3AED);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 40px rgba(139, 92, 246, 0.3);
            position: relative;
        }
        
        .splash-icon::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 30px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), transparent);
            z-index: -1;
            filter: blur(12px);
        }
        
        .splash-icon svg {
            width: 56px;
            height: 56px;
            fill: white;
        }
        
        .splash-brand {
            text-align: center;
        }
        
        .splash-title {
            color: #F8FAFC;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0;
        }
        
        .splash-subtitle {
            color: #64748B;
            font-size: 14px;
            font-weight: 400;
            margin: 4px 0 0;
        }
        
        .splash-loader {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 4px;
        }
        
        .splash-loader .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #8B5CF6;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .splash-loader .dot:nth-child(1) { animation-delay: -0.32s; }
        .splash-loader .dot:nth-child(2) { animation-delay: -0.16s; }
        .splash-loader .dot:nth-child(3) { animation-delay: 0s; }
        
        @keyframes bounce {
            0%, 80%, 100% { 
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% { 
                transform: scale(1);
                opacity: 1;
            }
        }
        
        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: scale(0.95) translateY(10px);
            }
            to { 
                opacity: 1; 
                transform: scale(1) translateY(0);
            }
        }
        
        @media (max-width: 480px) {
            .splash-icon {
                width: 90px;
                height: 90px;
                border-radius: 22px;
            }
            .splash-icon svg {
                width: 42px;
                height: 42px;
            }
            .splash-title {
                font-size: 26px;
            }
            .splash-subtitle {
                font-size: 13px;
            }
        }
        
        @media (max-width: 380px) {
            .splash-icon {
                width: 72px;
                height: 72px;
                border-radius: 18px;
            }
            .splash-icon svg {
                width: 34px;
                height: 34px;
            }
            .splash-title {
                font-size: 22px;
            }
        }
        
        @media (min-width: 768px) {
            .splash-icon {
                width: 160px;
                height: 160px;
                border-radius: 36px;
            }
            .splash-icon svg {
                width: 74px;
                height: 74px;
            }
            .splash-title {
                font-size: 42px;
            }
        }
        
        @media (prefers-color-scheme: light) {
            body {
                background: #F8FAFC;
            }
            .splash-title {
                color: #0F172A;
            }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="splash-icon">
            <img src="/MotoBindLogo.png" alt="MotoBind">
        </div>
        <div class="splash-brand">
            <h1 class="splash-title">MotoBind</h1>
            <p class="splash-subtitle">Сервис для мотоциклистов</p>
        </div>
        <div class="splash-loader">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>
    
    <script>
        let splashTimer = setTimeout(function() {
            window.location.href = '/';
        }, 2500);
        
        window.addEventListener('load', function() {
            clearTimeout(splashTimer);
            setTimeout(function() {
                window.location.href = '/';
            }, 800);
        });
        
        if (navigator.serviceWorker) {
            navigator.serviceWorker.ready.then(function() {
                clearTimeout(splashTimer);
                setTimeout(function() {
                    window.location.href = '/';
                }, 500);
            });
        }
    </script>
</body>
</html>
