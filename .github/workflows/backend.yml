name: Backend

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gcc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          TESTING: 'true'
          DISABLE_SCHEDULER: 'true'
          ENABLE_DEV_SCHEDULER: 'false'
          SECRET_KEY: 'ci-secret-key-not-for-production-0123456789'
          JWT_SECRET_KEY: 'ci-jwt-secret-key-not-for-production-0123456789'
        run: pytest -v

  lint:
    name: lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: flake8
        run: flake8 app/ --max-line-length=120 --extend-ignore=E203,W503
        continue-on-error: true

      - name: ruff
        run: ruff check app/
        continue-on-error: true

      - name: black --check
        run: black --check app/
        continue-on-error: true

      - name: isort --check
        run: isort --check-only app/
        continue-on-error: true
